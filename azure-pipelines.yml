trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: BuildAngular
  displayName: Build Angular
  jobs:
  - job: Angular
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'

    - script: |
        cd StudentPortal
        npm ci
        npm run build
      displayName: Build Angular application

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: 'StudentPortal/dist'
        artifact: angular

- stage: BuildReact
  displayName: Build React
  jobs:
  - job: React
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'

    - script: |
        cd course-portal
        npm ci
        npm run build
      displayName: Build React application

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: 'course-portal/build'
        artifact: react

- stage: BuildDotNet
  displayName: Build and Package .NET APIs
  jobs:
  - job: BuildApis
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: '8.x'

    - task: DotNetCoreCLI@2
      displayName: Restore .NET projects
      inputs:
        command: restore
        projects: |
          StudentService/StudentService.csproj
          CourseService/CourseService.csproj
          AuthService/AuthService.csproj

    - task: DotNetCoreCLI@2
      displayName: Build .NET APIs
      inputs:
        command: build
        projects: |
          StudentService/StudentService.csproj
          CourseService/CourseService.csproj
          AuthService/AuthService.csproj
        arguments: '--configuration Release --no-restore'

    # 🧩 Build and push Docker images for each API
    - task: Docker@2
      displayName: Build and push Student API image
      inputs:
        command: buildAndPush
        containerRegistry: 'dockerRegistryConnection'
        repository: 'student-api'
        Dockerfile: 'StudentService/Dockerfile'
        tags: |
          $(Build.BuildId)

    - task: Docker@2
      displayName: Build and push Course API image
      inputs:
        command: buildAndPush
        containerRegistry: 'dockerRegistryConnection'
        repository: 'course-api'
        Dockerfile: 'CourseService/Dockerfile'
        tags: |
          $(Build.BuildId)

    - task: Docker@2
      displayName: Build and push Auth API image
      inputs:
        command: buildAndPush
        containerRegistry: 'dockerRegistryConnection'
        repository: 'auth-api'
        Dockerfile: 'AuthService/Dockerfile'
        tags: |
          $(Build.BuildId)

- stage: BuildReporting
  displayName: Build Reporting Image
  jobs:
  - job: BuildReporting
    steps:
    - script: |
        python -m pip install --upgrade pip
        pip install -r PythonServices/reporting_service/requirements.txt
        pytest
      displayName: Test Python service

    - task: Docker@2
      displayName: Build and push reporting image
      inputs:
        command: buildAndPush
        containerRegistry: 'dockerRegistryConnection'
        repository: 'reporting-service'
        Dockerfile: 'PythonServices/reporting_service/Dockerfile'
        tags: |
          $(Build.BuildId)

- stage: Deploy
  displayName: Deploy to AKS Staging
  dependsOn:
    - BuildAngular
    - BuildReact
    - BuildDotNet
    - BuildReporting
  jobs:
  - deployment: DeployServices
    environment: 'staging'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: DownloadPipelineArtifact@2
            inputs:
              buildType: 'current'
              targetPath: '$(Pipeline.Workspace)/artifacts'

          - task: KubernetesManifest@1
            displayName: Deploy Student API
            inputs:
              action: deploy
              kubernetesServiceConnection: 'aksConnection'
              namespace: 'staging'
              manifests: |
                          $(System.DefaultWorkingDirectory)/k8s/student-deployment.yaml
                          $(System.DefaultWorkingDirectory)/k8s/student-service.yaml
              containers: |
                student-api=fullstackregistry.azurecr.io/student-api:$(Build.BuildId)

          - task: KubernetesManifest@1
            displayName: Deploy Course API
            inputs:
              action: deploy
              kubernetesServiceConnection: 'aksConnection'
              namespace: 'staging'
              manifests: |
                          $(System.DefaultWorkingDirectory)/k8s/course-deployment.yaml
                          $(System.DefaultWorkingDirectory)/k8s/course-service.yaml
              containers: |
                course-api=fullstackregistry.azurecr.io/course-api:$(Build.BuildId)

          - task: KubernetesManifest@1
            displayName: Deploy Auth API
            inputs:
              action: deploy
              kubernetesServiceConnection: 'aksConnection'
              namespace: 'staging'
              manifests: |
                          $(System.DefaultWorkingDirectory)/k8s/auth-deployment.yaml
                          $(System.DefaultWorkingDirectory)/k8s/auth-service.yaml
              containers: |
                auth-api=fullstackregistry.azurecr.io/auth-api:$(Build.BuildId)

          - task: KubernetesManifest@1
            displayName: Deploy Reporting Service
            inputs:
              action: deploy
              kubernetesServiceConnection: 'aksConnection'
              namespace: 'staging'
              manifests: '$(System.DefaultWorkingDirectory)/k8s/reporting-deployment.yaml'
              containers: |
                reporting-service=fullstackregistry.azurecr.io/reporting-service:$(Build.BuildId)
