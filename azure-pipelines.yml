trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageTag: '$(Build.BuildId)'
  acrLoginServer: 'fullstackregistry-egdnarcrfxgaare7.azurecr.io'

stages:
- stage: BuildAngular
  displayName: Build Angular
  jobs:
  - job: Angular
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'

    - script: |
        cd StudentPortal
        npm ci
        npm run build
      displayName: Build Angular app

    - task: Docker@2
      displayName: Build and push Student frontend image
      inputs:
        command: 'buildAndPush'
        containerRegistry: 'dockerRegistryConnection'
        repository: 'student-frontend'
        Dockerfile: 'StudentPortal/Dockerfile'
        buildContext: 'StudentPortal'
        tags: |
          $(imageTag)

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: 'StudentPortal/dist'
        artifact: 'angular'

- stage: BuildReact
  displayName: Build React
  jobs:
  - job: React
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'

    - script: |
        cd course-portal
        npm ci
        npm run build
      displayName: Build React app

    - task: Docker@2
      displayName: Build and push Course frontend image
      inputs:
        command: 'buildAndPush'
        containerRegistry: 'dockerRegistryConnection'
        repository: 'course-frontend'
        Dockerfile: 'course-portal/Dockerfile'
        buildContext: 'course-portal'
        tags: |
          $(imageTag)

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: 'course-portal/build'
        artifact: 'react'

- stage: BuildDotNet
  displayName: Build and Package .NET APIs
  jobs:
  - job: BuildApis
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '8.x'

    - task: DotNetCoreCLI@2
      displayName: Restore .NET projects
      inputs:
        command: 'restore'
        projects: |
          StudentService/StudentService.csproj
          CourseService/CourseService.csproj
          AuthService/AuthService.csproj

    - task: DotNetCoreCLI@2
      displayName: Build .NET APIs
      inputs:
        command: 'build'
        projects: |
          StudentService/StudentService.csproj
          CourseService/CourseService.csproj
          AuthService/AuthService.csproj
        arguments: '--configuration Release --no-restore'

    - task: Docker@2
      displayName: Build and push Student API image
      inputs:
        command: 'buildAndPush'
        containerRegistry: 'dockerRegistryConnection'
        repository: 'student-api'
        Dockerfile: 'StudentService/Dockerfile'
        buildContext: 'StudentService'
        tags: |
          $(imageTag)

    - task: Docker@2
      displayName: Build and push Course API image
      inputs:
        command: 'buildAndPush'
        containerRegistry: 'dockerRegistryConnection'
        repository: 'course-api'
        Dockerfile: 'CourseService/Dockerfile'
        buildContext: 'CourseService'
        tags: |
          $(imageTag)

    - task: Docker@2
      displayName: Build and push Auth API image
      inputs:
        command: 'buildAndPush'
        containerRegistry: 'dockerRegistryConnection'
        repository: 'auth-api'
        Dockerfile: 'AuthService/Dockerfile'
        buildContext: 'AuthService'
        tags: |
          $(imageTag)

- stage: BuildReporting
  displayName: Build Reporting Image
  jobs:
  - job: BuildReporting
    steps:
    - script: |
        python -m pip install --upgrade pip
        pip install -r PythonServices/reporting_service/requirements.txt
        pytest
      displayName: Test Python service

    - task: Docker@2
      displayName: Build and push reporting image
      inputs:
        command: 'buildAndPush'
        containerRegistry: 'dockerRegistryConnection'
        repository: 'reporting-service'
        Dockerfile: 'PythonServices/reporting_service/Dockerfile'
        buildContext: 'PythonServices/reporting_service'
        tags: |
          $(imageTag)

- stage: DeployStaging
  displayName: Deploy to AKS Staging
  dependsOn:
    - BuildAngular
    - BuildReact
    - BuildDotNet
    - BuildReporting
  condition: succeeded()
  variables:
  - name: targetNamespace
    value: 'staging'
  - name: kubernetesServiceConnection
    value: 'aksConnection'
  - name: deploymentEnvironment
    value: 'staging'
  jobs:
  - template: pipelines/deploy-aks.yml
    parameters:
      deploymentEnvironment: 'staging'
      kubernetesServiceConnection: 'aksConnection'
      studentFrontendServiceManifest: 'k8s/student-frontend-service-staging.yaml'
      courseFrontendServiceManifest: 'k8s/course-frontend-service-staging.yaml'

- stage: DeployProduction
  displayName: Deploy to AKS Production
  dependsOn: DeployStaging
  condition: succeeded()
  variables:
  - name: targetNamespace
    value: 'production'
  - name: kubernetesServiceConnection
    value: 'aksProductionConnection'
  - name: deploymentEnvironment
    value: 'production'
  jobs:
  - template: pipelines/deploy-aks.yml
    parameters:
      deploymentEnvironment: 'production'
      kubernetesServiceConnection: 'aksProductionConnection'
      studentFrontendServiceManifest: 'k8s/student-frontend-service.yaml'
      courseFrontendServiceManifest: 'k8s/course-frontend-service.yaml'

