trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageTag: '$(Build.BuildId)'
  acrLoginServer: 'fullstackregistry-egdnarcrfxgaare7.azurecr.io'

stages:
- stage: BuildAngular
  displayName: Build Angular
  jobs:
  - job: Angular
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'

    - script: |
        cd StudentPortal
        npm ci
        npm run build
      displayName: Build Angular app

    - task: Docker@2
      displayName: Build and push Student frontend image
      inputs:
        command: 'buildAndPush'
        containerRegistry: 'dockerRegistryConnection'
        repository: 'student-frontend'
        Dockerfile: 'StudentPortal/Dockerfile'
        buildContext: 'StudentPortal'
        tags: |
          $(imageTag)

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: 'StudentPortal/dist'
        artifact: 'angular'

- stage: BuildReact
  displayName: Build React
  jobs:
  - job: React
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'

    - script: |
        cd course-portal
        npm ci
        npm run build
      displayName: Build React app

    - task: Docker@2
      displayName: Build and push Course frontend image
      inputs:
        command: 'buildAndPush'
        containerRegistry: 'dockerRegistryConnection'
        repository: 'course-frontend'
        Dockerfile: 'course-portal/Dockerfile'
        buildContext: 'course-portal'
        tags: |
          $(imageTag)

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: 'course-portal/build'
        artifact: 'react'

- stage: BuildDotNet
  displayName: Build and Package .NET APIs
  jobs:
  - job: BuildApis
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '8.x'

    - task: DotNetCoreCLI@2
      displayName: Restore .NET projects
      inputs:
        command: 'restore'
        projects: |
          StudentService/StudentService.csproj
          CourseService/CourseService.csproj
          AuthService/AuthService.csproj

    - task: DotNetCoreCLI@2
      displayName: Build .NET APIs
      inputs:
        command: 'build'
        projects: |
          StudentService/StudentService.csproj
          CourseService/CourseService.csproj
          AuthService/AuthService.csproj
        arguments: '--configuration Release --no-restore'

    - task: Docker@2
      displayName: Build and push Student API image
      inputs:
        command: 'buildAndPush'
        containerRegistry: 'dockerRegistryConnection'
        repository: 'student-api'
        Dockerfile: 'StudentService/Dockerfile'
        buildContext: 'StudentService'
        tags: |
          $(imageTag)

    - task: Docker@2
      displayName: Build and push Course API image
      inputs:
        command: 'buildAndPush'
        containerRegistry: 'dockerRegistryConnection'
        repository: 'course-api'
        Dockerfile: 'CourseService/Dockerfile'
        buildContext: 'CourseService'
        tags: |
          $(imageTag)

    - task: Docker@2
      displayName: Build and push Auth API image
      inputs:
        command: 'buildAndPush'
        containerRegistry: 'dockerRegistryConnection'
        repository: 'auth-api'
        Dockerfile: 'AuthService/Dockerfile'
        buildContext: 'AuthService'
        tags: |
          $(imageTag)

- stage: BuildReporting
  displayName: Build Reporting Image
  jobs:
  - job: BuildReporting
    steps:
    - script: |
        python -m pip install --upgrade pip
        pip install -r PythonServices/reporting_service/requirements.txt
        pytest
      displayName: Test Python service

    - task: Docker@2
      displayName: Build and push reporting image
      inputs:
        command: 'buildAndPush'
        containerRegistry: 'dockerRegistryConnection'
        repository: 'reporting-service'
        Dockerfile: 'PythonServices/reporting_service/Dockerfile'
        buildContext: 'PythonServices/reporting_service'
        tags: |
          $(imageTag)

- stage: Deploy
  displayName: Deploy to AKS Staging
  dependsOn:
    - BuildAngular
    - BuildReact
    - BuildDotNet
    - BuildReporting
  condition: succeeded()
  jobs:
  - deployment: DeployServices
    displayName: Deploy services to AKS
    environment: 'staging'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: DownloadPipelineArtifact@2
            displayName: Download artifacts
            inputs:
              buildType: 'current'
              targetPath: '$(Pipeline.Workspace)/artifacts'

          - task: KubernetesManifest@1
            displayName: Configure ACR pull secret
            inputs:
              action: 'createSecret'
              kubernetesServiceConnection: 'aksConnection'
              namespace: 'staging'
              secretType: 'dockerRegistry'
              secretName: 'acr-secret'
              dockerRegistryEndpoint: 'dockerRegistryConnection'

          - task: Kubernetes@1
            displayName: Configure Azure SQL secrets
            inputs:
              connectionType: 'Kubernetes Service Connection'
              kubernetesServiceEndpoint: 'aksConnection'
              namespace: 'staging'
              command: 'apply'
              useConfigurationFile: true
              configurationType: 'inline'
              inline: |
                apiVersion: v1
                kind: Secret
                metadata:
                  name: database-secrets
                  namespace: staging
                type: Opaque
                stringData:
                  auth-connection: "$(AUTH_CONNECTION_STRING)"
                  student-connection: "$(STUDENT_CONNECTION_STRING)"
                  course-connection: "$(COURSE_CONNECTION_STRING)"
            env:
              AUTH_CONNECTION_STRING: $(AUTH_CONNECTION_STRING)
              STUDENT_CONNECTION_STRING: $(STUDENT_CONNECTION_STRING)
              COURSE_CONNECTION_STRING: $(COURSE_CONNECTION_STRING)

          - task: KubernetesManifest@1
            displayName: Make backend services internal
            inputs:
              action: 'deploy'
              kubernetesServiceConnection: 'aksConnection'
              namespace: 'staging'
              manifests: |
                $(System.DefaultWorkingDirectory)/k8s/auth-service.yaml
                $(System.DefaultWorkingDirectory)/k8s/student-service.yaml
                $(System.DefaultWorkingDirectory)/k8s/course-service.yaml
                $(System.DefaultWorkingDirectory)/k8s/reporting-service.yaml

          - task: Kubernetes@1
            displayName: Apply Angular frontend service
            inputs:
              connectionType: 'Kubernetes Service Connection'
              kubernetesServiceEndpoint: 'aksConnection'
              namespace: 'staging'
              command: 'apply'
              useConfigurationFile: true
              configurationType: 'file'
              configuration: '$(System.DefaultWorkingDirectory)/k8s/student-frontend-service.yaml'

          - task: KubernetesManifest@1
            displayName: Deploy Angular frontend
            inputs:
              action: 'deploy'
              kubernetesServiceConnection: 'aksConnection'
              namespace: 'staging'
              manifests: |
                $(System.DefaultWorkingDirectory)/k8s/student-frontend-deployment.yaml
              containers: |
                student-frontend=$(acrLoginServer)/student-frontend:$(imageTag)

          - task: Kubernetes@1
            displayName: Apply React frontend service
            inputs:
              connectionType: 'Kubernetes Service Connection'
              kubernetesServiceEndpoint: 'aksConnection'
              namespace: 'staging'
              command: 'apply'
              useConfigurationFile: true
              configurationType: 'file'
              configuration: '$(System.DefaultWorkingDirectory)/k8s/course-frontend-service.yaml'

          - task: KubernetesManifest@1
            displayName: Deploy React frontend
            inputs:
              action: 'deploy'
              kubernetesServiceConnection: 'aksConnection'
              namespace: 'staging'
              manifests: |
                $(System.DefaultWorkingDirectory)/k8s/course-frontend-deployment.yaml
              containers: |
                course-frontend=$(acrLoginServer)/course-frontend:$(imageTag)

          - task: KubernetesManifest@1
            displayName: Deploy Student API
            inputs:
              action: 'deploy'
              kubernetesServiceConnection: 'aksConnection'
              namespace: 'staging'
              manifests: |
                $(System.DefaultWorkingDirectory)/k8s/student-deployment.yaml
                $(System.DefaultWorkingDirectory)/k8s/student-service.yaml
              containers: |
                $(acrLoginServer)/student-api:$(imageTag)

          - task: KubernetesManifest@1
            displayName: Deploy Course API
            inputs:
              action: 'deploy'
              kubernetesServiceConnection: 'aksConnection'
              namespace: 'staging'
              manifests: |
                $(System.DefaultWorkingDirectory)/k8s/course-deployment.yaml
                $(System.DefaultWorkingDirectory)/k8s/course-service.yaml
              containers: |
                $(acrLoginServer)/course-api:$(imageTag)

          - task: KubernetesManifest@1
            displayName: Deploy Auth API
            inputs:
              action: 'deploy'
              kubernetesServiceConnection: 'aksConnection'
              namespace: 'staging'
              manifests: |
                $(System.DefaultWorkingDirectory)/k8s/auth-deployment.yaml
                $(System.DefaultWorkingDirectory)/k8s/auth-service.yaml
              containers: |
                $(acrLoginServer)/auth-api:$(imageTag)

          - task: KubernetesManifest@1
            displayName: Deploy Reporting Service
            inputs:
              action: 'deploy'
              kubernetesServiceConnection: 'aksConnection'
              namespace: 'staging'
              manifests: |
                $(System.DefaultWorkingDirectory)/k8s/reporting-deployment.yaml
              containers: |
                 $(acrLoginServer)/reporting-service:$(imageTag)

