apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-frontend
  labels:
    app: course-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: course-frontend
  template:
    metadata:
      labels:
        app: course-frontend
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: course-frontend
          image: fullstackregistry-egdnarcrfxgaare7.azurecr.io/course-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
