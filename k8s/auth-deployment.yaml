apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api  
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-api
  template:
    metadata:
      labels:
        app: auth-api
    spec:
      containers:
      - name: auth-api
        image: fullstackregistry.azurecr.io/auth-api:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: auth-api-service  
spec:
  selector:
    app: auth-api
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
