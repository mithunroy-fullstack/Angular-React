server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/auth/ {
        proxy_pass http://auth-api-service/api/auth/;
    }

    location /api/Student/ {
        proxy_pass http://student-api-service/api/Student/;
    }

    location /api/reports/ {
        proxy_pass http://reporting-service:8000/api/reports/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
